services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: grova
    restart: unless-stopped
    volumes:
      - ./config/jwt:/var/www/html/config/jwt:rw
      - grova_var:/var/www/html/var
      - grova_db_data:/var/lib/mysql
      - ./.env.local:/var/www/html/.env.local:rw
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      DEFAULT_URI: https://grovaapp.com
      CORS_ALLOW_ORIGIN: "^https://grovaapp\\.com$"
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL:-noreply@grovaapp.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      STORMGLASS_API_KEY: ${STORMGLASS_API_KEY:-}
      SSH_ROOT_PASSWORD: ${SSH_ROOT_PASSWORD:-GrovaTmp2026#}
    ports:
      - "8090:80"
      - "2222:22"

volumes:
  grova_db_data:
  grova_var:
