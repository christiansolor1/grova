services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: grova
    restart: unless-stopped
    volumes:
      - ./config/jwt:/var/www/html/config/jwt:ro
      - grova_var:/var/www/html/var
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "mysql://grova:${DB_PASSWORD}@db:3306/grova_core?serverVersion=mariadb-10.11.16&charset=utf8mb4"
      DATABASE_CORE_URL: "mysql://grova:${DB_PASSWORD}@db:3306/grova_core?serverVersion=mariadb-10.11.16&charset=utf8mb4"
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      DEFAULT_URI: https://grovaapp.com
      CORS_ALLOW_ORIGIN: "^https://grovaapp\\.com$"
      MAILER_DSN: ${MAILER_DSN}
      MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY}
      LICENSE_KEY: ${LICENSE_KEY:-}
      STORMGLASS_API_KEY: ${STORMGLASS_API_KEY}
    ports:
      - "8090:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - grova_network

  db:
    image: mariadb:10.11
    container_name: grova_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: grova_core
      MYSQL_USER: grova
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - grova_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grova_network

networks:
  grova_network:
    driver: bridge

volumes:
  grova_db_data:
  grova_var:
