server {
    listen 80;
    server_name grovaapp.com www.grovaapp.com;
    root /var/www/html/public;

    # Cloudflare Tunnel termina el SSL — aquí solo HTTP interno
    # X-Forwarded-Proto viene de Cloudflare

    client_max_body_size 20M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log  /var/log/nginx/grova-error.log;
    access_log /var/log/nginx/grova-access.log;
}
